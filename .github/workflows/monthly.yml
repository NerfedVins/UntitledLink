# yt-dlp is what rots. Sites change their markup, yt-dlp ships a fix within
# days, and a frozen exe cannot pip into itself - so a build left alone slowly
# stops working on the sites that change most.
#
# Once a month this cuts a fresh build on its own. It also takes a manual run,
# for the day something breaks on the 5th and waiting three weeks is absurd:
# Actions -> fresh build -> Run workflow, type go, choose whether the version
# moves.
name: fresh build

on:
  schedule:
    - cron: "0 5 1 * *"      # the first of the month, 05:00 UTC
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "go" to build and publish a fresh release now'
        required: true
        default: ""
      bump:
        description: "patch = 0.1.2 becomes 0.1.3 and everyone is told; none = same version, binaries replaced quietly"
        type: choice
        default: patch
        options: [patch, none]

# contents to commit the version and push the tag; actions to ask release.yml
# for a build. Naming any permission here drops every one not named to none,
# so leaving actions out is what makes the dispatch below answer 403.
permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: A release is not something to publish by a stray click
        if: github.event_name == 'workflow_dispatch' && inputs.confirm != 'go'
        run: |
          echo "::error::type go in the confirm field to publish a release"
          exit 1

      - uses: actions/checkout@v4

      - name: Move the version, or do not
        id: version
        run: |
          old=$(grep -oP '(?<=^VERSION = ")[0-9.]+' untitledlink.py)
          if [ "${{ inputs.bump }}" = "none" ]; then
            # Same version, new binaries. Nobody is told: the app compares
            # version numbers, so a build that keeps its number is a build its
            # users never hear about.
            echo "tag=v$old" >> "$GITHUB_OUTPUT"
            echo "moved=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          new=$(echo "$old" | awk -F. '{print $1 "." $2 "." $3 + 1}')
          sed -i "s/^VERSION = \"$old\"/VERSION = \"$new\"/" untitledlink.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "rebuild for a fresh yt-dlp: $old -> $new"
          git push origin HEAD
          echo "tag=v$new" >> "$GITHUB_OUTPUT"
          echo "moved=yes" >> "$GITHUB_OUTPUT"

      # The tag alone does not set the release going, which is the whole
      # reason this file had never produced a binary. A push made with the
      # default GITHUB_TOKEN does not start another workflow - GitHub refuses
      # that on purpose, so a workflow cannot trigger itself round in a
      # circle. So this tagged, reported "version moved: yes", and nothing
      # ever built. v0.1.2 sat tagged and unreleased because of it.
      #
      # workflow_dispatch is the documented exception to that rule: it and
      # repository_dispatch are the two events GITHUB_TOKEN may still raise.
      # So the tag is pushed for the release to be named after, and the build
      # is asked for explicitly rather than hoped for.
      - name: Tag it
        run: |
          git tag "${{ steps.version.outputs.tag }}" --force
          git push origin "${{ steps.version.outputs.tag }}" --force

      - name: And ask for the build, since the tag will not
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --ref "${{ steps.version.outputs.tag }}"
          {
            echo "### ${{ steps.version.outputs.tag }}"
            echo
            echo "version moved: ${{ steps.version.outputs.moved }}"
            echo
            echo "The binaries are built by the **release** workflow, asked for"
            echo "just now against this tag. This job going green means the tag"
            echo "exists and the build was requested - not that it finished."
          } >> "$GITHUB_STEP_SUMMARY"
