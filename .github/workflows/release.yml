# Both binaries, built by the machines that can build them, from one tag.
#
# The Windows exe goes through build.bat rather than a copy of its flags, so
# the exe CI ships is the exe the build file makes - a second list of
# PyInstaller flags here would drift within a month.
#
# The macOS list below is exactly that second list, because a .app is not
# something build.bat can make, and it drifted: it was three hidden imports
# behind before anyone built with it. There is no build.sh to point at yet, so
# the guard is the line that runs the built app's own suite - which is what
# would have caught it. Add flags to one of the two and check the other.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: .\build.bat
        shell: cmd
      - name: The exe has to pass its own suite before anyone downloads it
        run: .\dist\UntitledLink.exe --selftest
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/UntitledLink.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pyinstaller pyinstaller-hooks-contrib
      - run: python untitledlink.py --selftest

      # macOS wants an .icns: a folder of sizes, turned into one file by a tool
      # that exists only here.
      - name: Icon
        run: |
          mkdir icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size icon.png --out icon.iconset/icon_${size}x${size}.png
            sips -z $((size * 2)) $((size * 2)) icon.png --out icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns icon.iconset -o icon.icns

      # No --onefile: a .app is a folder and macOS expects it that way.
      #
      # The three hidden imports are the three build.bat carries, for the
      # same reasons: each is imported by name at the moment it is needed, so
      # nothing static sees it. They were missing here, which is what a second
      # list of flags costs. PIL._tkinter_finder is what lets a frozen build
      # hand an image to Tk; socks and its urllib3 adapter are what requests
      # reaches for the first time a socks5h:// proxy is used, which is the
      # tor switch.
      - name: Build
        run: |
          pyinstaller --noconfirm --windowed --name UntitledLink \
            --icon icon.icns \
            --collect-all yt_dlp \
            --collect-all imageio_ffmpeg \
            --collect-all certifi \
            --collect-all docx \
            --hidden-import PIL._tkinter_finder \
            --hidden-import socks \
            --hidden-import urllib3.contrib.socks \
            --add-data "icon.png:." \
            --add-data "icon.ico:." \
            untitledlink.py

      # The line the windows job already has, and the one the release notes
      # have been promising for both. The suite above ran against the source,
      # which says nothing about whether the thing being uploaded starts. It
      # builds the real window, and the mark column goes through PIL and Tk
      # together - so a frozen build missing either answers with an exit code.
      - name: The app has to pass its own suite before anyone downloads it
        run: dist/UntitledLink.app/Contents/MacOS/UntitledLink --selftest

      - run: ditto -c -k --keepParent dist/UntitledLink.app UntitledLink-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: UntitledLink-macos.zip

  publish:
    needs: [windows, macos]
    # Only a tag names a release. Run this by hand from a branch and it would
    # otherwise try to publish something called "main".
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Notes, with the checksums and the yt-dlp that went in
        run: |
          version="${GITHUB_REF_NAME#v}"
          ytdlp=$(grep -oE 'yt-dlp[><=~ ]*[0-9.]*' requirements.txt | head -1)
          {
            echo "Paste a link, see what is downloadable, take it clean."
            echo
            echo "**Windows** - download \`UntitledLink.exe\` and double-click it."
            echo "Nothing to install. SmartScreen warns the first time because the exe"
            echo "is unsigned: **More info -> Run anyway**."
            echo
            echo "**macOS** - unzip \`UntitledLink-macos.zip\` and drag the app where you"
            echo "like. It is unsigned too, so the first launch is **right-click -> Open"
            echo "-> Open**."
            echo
            echo "Both were built by CI from the \`$GITHUB_REF_NAME\` tag, and both"
            echo "answered \`--selftest\` with exit code 0 before being uploaded."
            echo
            echo '### Checksums'
            echo
            echo '```'
            # Hash first, bare filename second. The obvious sed for this -
            # strip everything up to the last slash - is greedy and eats the
            # hash along with the directory, which is why every release so
            # far has published a checksum block of two filenames and no
            # checksums. basename cannot make that mistake, and taking the
            # first field works whether sha256sum separates with two spaces
            # or with the binary-mode star.
            (cd built && for f in */*; do
              echo "$(sha256sum "$f" | cut -d' ' -f1)  $(basename "$f")"
            done)
            echo '```'
          } > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The second branch is the rebuild of a version that already
          # has a release - the "same version, new binaries" path. It has
          # to edit the notes as well as replace the files: PyInstaller
          # does not build the same bytes twice, so notes left alone would
          # go on publishing the checksums of the binaries they replaced,
          # and a checksum that does not match is worse than none at all.
          gh release create "$GITHUB_REF_NAME" \
            --title "UntitledLink ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            built/windows/UntitledLink.exe \
            built/macos/UntitledLink-macos.zip \
          || {
            gh release upload "$GITHUB_REF_NAME" \
              built/windows/UntitledLink.exe \
              built/macos/UntitledLink-macos.zip --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          }
